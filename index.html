<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0706"><title>Bottels &amp; Barrels — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0706;--gold:#d4af37;--g2:#f3d27a;--tx:#f4ead5;--mut:#b9a98a;--bd:rgba(212,175,55,.28);--gl:rgba(255,235,190,.06);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.ser{font-family:Cinzel,Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#000;transition:opacity .8s}
#loader.off{opacity:0;pointer-events:none}
.logo{width:min(62vw,280px);display:block;filter:drop-shadow(0 0 30px rgba(212,175,55,.45));animation:pl 2.2s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.04);filter:drop-shadow(0 0 48px rgba(243,210,122,.7))}}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;gap:16px;background:radial-gradient(ellipse at 50% 25%,#43260a 0,#1a0c08 45%,#0a0706 80%)}
.hero h1{font-size:clamp(1.5rem,6.5vw,2.8rem);letter-spacing:.12em;line-height:1.25;background:linear-gradient(#fff3c4,#d4af37 60%,#8a6a14);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);letter-spacing:.25em;text-transform:uppercase;font-size:.8rem}
.btn{margin-top:10px;padding:16px 34px;border-radius:99px;font-weight:600;letter-spacing:.16em;color:#1a0f02;background:linear-gradient(135deg,#f6dc8c,#d4af37 55%,#a67c14);box-shadow:0 8px 32px rgba(212,175,55,.3);transition:transform .2s}
.btn:active{transform:scale(.96)}
.snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:40;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:rgba(10,7,6,.6);backdrop-filter:blur(10px);font-size:.75rem;color:var(--g2)}
.view{display:none;animation:in .6s ease both}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.top{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(10,7,6,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}.brand img{height:34px}.brand b{font-family:Cinzel,serif;letter-spacing:.14em;font-size:.95rem;color:var(--g2)}
.q{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);font:inherit;font-size:16px;outline:none}.q:focus{border-color:var(--gold)}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 110px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;overflow:hidden;text-align:left;padding:16px 14px;min-height:150px;border-radius:18px;border:1px solid var(--bd);background:linear-gradient(160deg,var(--c1),#120a07 80%);transition:transform .25s,border-color .25s,box-shadow .25s;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;animation:in .6s both}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 10px 30px rgba(212,175,55,.2);outline:0}.card:active{transform:scale(.97)}
.card .em{position:absolute;top:10px;right:12px;font-size:2.6rem;filter:drop-shadow(0 6px 10px #000);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(6deg)}}
.card h3{font-size:1rem;letter-spacing:.06em;color:var(--g2)}.card small{color:var(--mut)}
.stage{position:relative;height:42svh;min-height:290px;background:radial-gradient(ellipse at 50% 55%,var(--glow,#5a3510) 0,#0a0706 72%);overflow:hidden;transition:background .6s}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.fb{position:absolute;inset:0;display:none;place-items:center;font-size:7rem;animation:fl 4s infinite}
.stage h2{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:1.3rem;letter-spacing:.14em;color:var(--g2);text-shadow:0 2px 12px #000;pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;border-bottom:1px solid var(--bd)}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);font-size:.8rem;color:var(--mut);transition:.25s}.chip.on{background:linear-gradient(135deg,#f6dc8c,#c79a1e);color:#1a0f02;border-color:transparent;font-weight:600}
.sub{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:1px solid var(--bd);padding-bottom:8px}.sub h3{font-size:1rem;letter-spacing:.1em;color:var(--gold)}.sub span{font-size:.7rem;color:var(--mut)}
.item{display:flex;justify-content:space-between;gap:14px;padding:14px;margin-bottom:8px;border-radius:14px;border:1px solid rgba(212,175,55,.14);background:var(--gl);backdrop-filter:blur(8px);opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}.item.v{opacity:1;transform:none}
.item h4{font-size:.95rem;font-weight:600;letter-spacing:.02em}.item p{margin-top:3px;font-size:.78rem;color:var(--mut);line-height:1.4}.item .tag{display:block;font-size:.68rem;color:var(--gold);margin-bottom:2px;letter-spacing:.1em;text-transform:uppercase}
.pp{display:flex;gap:12px;align-items:flex-start;flex:none}.pp span{font-weight:600;color:var(--g2);font-size:1.05rem;text-align:right;white-space:nowrap}.pp i{display:block;font-style:normal;font-size:.6rem;color:var(--mut);font-weight:400}
.back{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;padding:13px 24px;border-radius:99px;border:1px solid var(--gold);background:rgba(10,7,6,.82);backdrop-filter:blur(12px);color:var(--g2);font-size:.85rem;letter-spacing:.08em;box-shadow:0 8px 30px #000;display:none}.back.on{display:block}
.empty{text-align:center;color:var(--mut);padding:40px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.item{opacity:1;transform:none}}
</style></head><body>
